name: generate-name-art

on:
  workflow_dispatch: # تشغيل يدوي
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Professional ASCII Art
        run: |
          # تثبيت أداة figlet لتوليد خطوط برمجية احترافية
          sudo apt-get install -y figlet
          
          # إنشاء مجلد للمخرجات
          mkdir -p output
          
          # توليد الاسم بتنسيق "Slant" الجذاب للمبرمجين
          echo "### My Identity in Code" > output/identity.md
          echo '```text' >> output/identity.md
          figlet -f slant "AHMED" >> output/identity.md
          echo '```' >> output/identity.md
          
          # إضافة لمسة تقنية (System Info) لتعزيز مظهر الـ Senior
          echo "---" >> output/identity.md
          echo "**Last Compiled:** $(date)" >> output/identity.md
          echo "**Environment:** GitHub Actions / Ubuntu-Latest" >> output/identity.md

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: art-assets
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN
          }}
