name: generate-ahmed-signature-snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Draw AHMED on Contribution Grid
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # المصفوفة تمثل الحروف (0 = فراغ، 1 = نقطة خضراء)
          # كل حرف عبارة عن 5 أعمدة و 7 صفوف
          # تم اختصار المنطق ليعمل في Bash
          
          declare -A map
          # حرف A
          map[0,1]=1; map[0,2]=1; map[0,3]=1; map[1,0]=1; map[1,2]=1; map[2,0]=1; map[2,2]=1; map[3,1]=1; map[3,2]=1; map[3,3]=1;
          # حرف H
          map[5,0]=1; map[5,1]=1; map[5,2]=1; map[5,3]=1; map[5,4]=1; map[7,2]=1; map[9,0]=1; map[9,1]=1; map[9,2]=1; map[9,3]=1; map[9,4]=1;
          # حرف M
          map[11,0]=1; map[11,4]=1; map[12,1]=1; map[13,2]=1; map[14,1]=1; map[15,0]=1; map[15,4]=1;
          # حرف E
          map[17,0]=1; map[17,1]=1; map[17,2]=1; map[17,3]=1; map[17,4]=1; map[18,0]=1; map[18,2]=1; map[18,4]=1; map[19,0]=1; map[19,2]=1; map[19,4]=1;
          # حرف D
          map[21,0]=1; map[21,1]=1; map[21,2]=1; map[21,3]=1; map[21,4]=1; map[22,0]=1; map[22,4]=1; map[23,1]=1; map[23,2]=1; map[23,3]=1;

          START_WEEKS_AGO=50
          
          for col in {0..25}; do
            for row in {0..6}; do
              if [[ ${map[$col,$row]} == 1 ]]; then
                # حساب عدد الأسابيع والأيام للوصول للمربع الصحيح
                weeks_back=$((START_WEEKS_AGO - col))
                days_back=$((row))
                d=$(date -I -d "$weeks_back weeks ago + $days_back days")
                
                # عمل 20 commit لضمان اللون الأخضر الغامق
                for i in {1..20}; do
                  GIT_AUTHOR_DATE="$d 12:0
