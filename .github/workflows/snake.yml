name: generate-professional-banner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Custom SVG Banner
        run: |
          mkdir -p output
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100">
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="transparent" />
            <text x="50%" y="50%" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="url(#grad1)" text-anchor="middle" dominant-baseline="middle">
              AHMED ELSHIEKH
            </text>
          </svg>' > output/banner.svg

      - name: Deploy Banner
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output-assets
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
